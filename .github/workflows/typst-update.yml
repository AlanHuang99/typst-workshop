# Once a week, and when started by hand on main: if crates.io has a stable Typst newer than the one the helper is pinned to, and this repository has no pull request for it yet (closing one skips that version), the first job moves the helper to it with scripts/typst-update.mjs, and the second job pushes the result to the branch typst-<version>, opens a pull request for that branch and starts CI on it. Merging and releasing stay manual.
name: Typst update

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typst-update
  cancel-in-progress: false

jobs:
  # Runs third-party code (dtolnay/rust-toolchain, cargo-about), so its token only reads and the checkout does not keep it.
  prepare:
    name: Move to the newest Typst
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # gh pr list
    outputs:
      newer: ${{ steps.check.outputs.newer }}
      exists: ${{ steps.check.outputs.exists }}
      latest: ${{ steps.check.outputs.latest }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      # Full history and tags: the extension's new version depends on its released (tagged) versions.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare the pinned Typst with the newest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions="$(node scripts/typst-update.mjs check)"
          echo "$versions"
          echo "$versions" >> "$GITHUB_OUTPUT"
          branch="typst-$(echo "$versions" | sed -n 's/^latest=//p')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Pull requests of this repository only: a pull request from a fork can have a branch of the same name.
          pulls="$(gh pr list --head "$branch" --state all --json isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | length')"
          if [ "$pulls" != 0 ]; then
            echo "A pull request for $branch exists already."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        with:
          toolchain: stable

      - name: Install cargo-about
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Move the helper to the newest Typst
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          mkdir -p "$RUNNER_TEMP/typst-update"
          node scripts/typst-update.mjs apply "$LATEST" > "$RUNNER_TEMP/typst-update/summary.md"
          git diff --binary > "$RUNNER_TEMP/typst-update/update.patch"

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        with:
          name: typst-update
          path: ${{ runner.temp }}/typst-update/
          if-no-files-found: error

  # Holds the write token, so it runs only git, gh and first-party actions.
  publish:
    name: Open the pull request
    needs: prepare
    if: needs.prepare.outputs.newer == 'true' && needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the branch typst-<version>
      pull-requests: write # opens its pull request
      actions: write # starts CI on the branch (a pull request opened with this workflow's token does not start workflows)
    steps:
      # The commit of this run, which the first job updated.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: typst-update
          path: ${{ runner.temp }}/typst-update

      - name: Push the branch, open the pull request and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git apply --index "$RUNNER_TEMP/typst-update/update.patch"
          git commit -q -m "Typst $LATEST"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Typst $LATEST" --body-file "$RUNNER_TEMP/typst-update/summary.md"
          gh workflow run ci.yml --ref "$BRANCH"
