# Once a week, and when started by hand: if crates.io has a stable Typst newer than the one the helper is pinned to, and no pull request for it exists yet (closing one skips that version), scripts/typst-update.mjs moves the helper to it on the branch typst-<version>, a pull request is opened for that branch, and CI runs on it. Merging and releasing stay manual.
name: Typst update

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typst-update
  cancel-in-progress: false

jobs:
  update:
    name: Move to the newest Typst
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes the branch typst-<version>
      pull-requests: write # opens its pull request
      actions: write # starts CI on the branch (a pull request opened with this workflow's token does not start workflows)
    steps:
      # Full history and tags: the update gives the extension a new version only when its current one is released (tagged). The token stays for the push.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare the pinned Typst with the newest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions="$(node scripts/typst-update.mjs check)"
          echo "$versions"
          echo "$versions" >> "$GITHUB_OUTPUT"
          branch="typst-$(echo "$versions" | sed -n 's/^latest=//p')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          pulls="$(gh pr list --head "$branch" --state all --json number --jq length)"
          if [ "$pulls" != 0 ]; then
            echo "A pull request for $branch exists already."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        with:
          toolchain: stable

      - name: Install cargo-about
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Move the helper to the newest Typst
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: node scripts/typst-update.mjs apply "$LATEST" > "$RUNNER_TEMP/summary.md"

      - name: Push the branch, open the pull request and start CI
        if: steps.check.outputs.newer == 'true' && steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -u
          git commit -q -m "Typst $LATEST"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Typst $LATEST" --body-file "$RUNNER_TEMP/summary.md"
          gh workflow run ci.yml --ref "$BRANCH"
