# Builds, tests and packages the extension for linux-x64 and darwin-arm64. release.yml calls this workflow for releases. The weekly run builds main with the newest Rust and tests it in the newest VS Code, which no lock file pins.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux helper is a static executable (musl, with OpenSSL built in), so that it runs whatever the C library and OpenSSL of the host.
          - os: ubuntu-latest
            target: linux-x64
            rust-target: x86_64-unknown-linux-musl
            helper-features: vendored-openssl
            typst-asset: typst-x86_64-unknown-linux-musl.tar.xz
          # macos-latest runs on Apple silicon; like ubuntu-latest, it follows GitHub's newest image.
          - os: macos-latest
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
            helper-features: ''
            typst-asset: typst-aarch64-apple-darwin.tar.xz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The oldest macOS the helper runs on; rustc and the C compiler read it.
      - name: Build for macOS 11 and later
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: helper
          key: ${{ matrix.rust-target }}

      # The PDF tab tests compile their fixtures with the typst CLI of the Typst version the helper is pinned to.
      - name: Install the typst CLI
        id: typst
        env:
          TYPST_ASSET: ${{ matrix.typst-asset }}
        run: |
          version="$(node scripts/typst-update.mjs pinned)"
          curl -fsSL --retry 3 "https://github.com/typst/typst/releases/download/v$version/$TYPST_ASSET" | tar -xJf - -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${TYPST_ASSET%.tar.xz}/typst" --version
          echo "$RUNNER_TEMP/${TYPST_ASSET%.tar.xz}" >> "$GITHUB_PATH"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build
        id: build
        run: |
          npm run build:helper -- --target "${{ matrix.rust-target }}" --features "${{ matrix.helper-features }}"
          npm run build:ext

      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx vitest run

      - name: Helper tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:helper -- --target "${{ matrix.rust-target }}" --features "${{ matrix.helper-features }}"

      - name: Install Chromium for the PDF tab tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: npx playwright install --with-deps chromium

      - name: Install Chromium for the PDF tab tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        run: npx playwright install chromium

      - name: PDF tab tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:viewer

      # These run the helper built above, the one that goes into the package.
      - name: Extension-host tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run -a npm run test:extension

      - name: Extension-host tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        run: npm run test:extension

      - name: Package
        run: npm run package -- --target "${{ matrix.target }}" --helper-target "${{ matrix.rust-target }}" --features "${{ matrix.helper-features }}"

      # The helper inside the package must start on this runner and report its version and Typst's.
      - name: Check the helper in the package
        env:
          TARGET: ${{ matrix.target }}
          PINNED_TYPST: ${{ steps.typst.outputs.version }}
        run: |
          version="$(node -p "require('./package.json').version")"
          helper_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' helper/Cargo.toml | head -n 1)"
          expected="typst-workshop-helper $helper_version (typst $PINNED_TYPST)"
          dir="$(mktemp -d)"
          unzip -q "typst-workshop-$TARGET-$version.vsix" -d "$dir"
          actual="$("$dir/extension/bin/typst-workshop-helper" --version)"
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The helper in the package reports \"$actual\"; expected \"$expected\"."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: typst-workshop-${{ matrix.target }}
          path: typst-workshop-${{ matrix.target }}-*.vsix
          if-no-files-found: error
