# Weekly pull requests that update the npm packages and the GitHub Actions; CI runs on each. The helper's Rust crates move with each Typst update (typst-update.yml), which also regenerates their licence file. pdfjs-dist and @types/vscode are raised by hand: the PDF tab builds on pdf.js's viewer components, and @types/vscode follows engines.vscode in package.json. @types/node keeps the major version of the Node.js that CI uses.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pdfjs-dist
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/ovsx
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
